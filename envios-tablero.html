<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Envíos · CeroCero</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0D0D0D; --white: #FFFFFF; --surface: #F5F5F5;
    --border: #E8E8E8; --muted: #999999; --amber: #C97A00;
  }
  body {
    font-family: 'Montserrat', -apple-system, sans-serif;
    background: var(--white); color: var(--black);
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  }
  #app { width: 100%; max-width: 1040px; margin: 0 auto; padding: 40px 24px 60px; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .back-link {
    text-decoration: none; color: var(--black); border: 1px solid var(--border);
    border-radius: 4px; width: 42px; height: 42px; display: inline-flex;
    align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .back-link:hover { border-color: var(--black); }
  .brand { font-size: 12px; font-weight: 200; color: var(--muted); letter-spacing: .25em; text-transform: uppercase; }
  h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 900; letter-spacing: -.02em; text-transform: uppercase; line-height: 1; }
  .subtitle { font-size: 13px; font-weight: 200; color: var(--muted); margin: 6px 0 22px; line-height: 1.6; }

  /* Tablero — calendario semanal (Lun–Vie), por día y canal (?action=envioSemana). */
  .tablero { width: 100%; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .tablero-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; background: var(--black); color: var(--white); }
  .tablero-titulo { font-size: 16px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; text-align: center; flex: 1; }
  .nav-btn { background: rgba(255,255,255,.14); color: var(--white); border: none; border-radius: 2px; width: 42px; height: 42px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .tablero-body { width: 100%; overflow-x: auto; }
  table.cal { width: 100%; border-collapse: collapse; font-size: 17px; }
  table.cal th, table.cal td { padding: 16px 12px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.cal thead th { font-size: 12px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
  table.cal tbody td { font-size: 22px; font-weight: 700; }
  table.cal td.dia { text-align: left; font-weight: 700; letter-spacing: .02em; font-size: 15px; }
  table.cal td.tot, table.cal th.tot { font-weight: 900; background: var(--surface); }
  table.cal td.cero { color: var(--muted); font-weight: 200; }
  table.cal tr.hoy td { background: #FFF7E6; }
  table.cal tr.hoy td.dia { color: var(--amber); }
  table.cal tfoot td { font-weight: 900; font-size: 20px; background: var(--black); color: var(--white); border-bottom: none; }
  table.cal tfoot td.dia { font-size: 15px; }
  .nota { font-size: 11px; font-weight: 200; color: var(--muted); margin-top: 14px; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="back-link" href="index.html" aria-label="Volver al scanner">&#8592;</a>
    <div>
      <div class="brand">CeroCero · Almacén</div>
      <h1>Tablero de Envíos</h1>
    </div>
  </div>
  <p class="subtitle">Cuántas guías se escanearon (evidencias subidas) por día y canal. Cada semana vive por su cuenta; el lunes arranca en cero solito.</p>

  <div class="tablero">
    <div class="tablero-head">
      <button class="nav-btn" id="sem-prev" type="button" aria-label="Semana anterior">&#9664;</button>
      <span class="tablero-titulo" id="sem-titulo">Semana</span>
      <button class="nav-btn" id="sem-next" type="button" aria-label="Semana siguiente">&#9654;</button>
    </div>
    <div class="tablero-body" id="tablero-body"></div>
  </div>
  <p class="nota">Los datos viven por día y canal en el backend del scanner (solo lectura). Nada se pierde al recargar.</p>
</div>

<script>
// Mismo backend del Scanner (solo lectura: ?action=envioSemana).
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzyt2_OBXDiGStpeyTAkQGBAG_wWGI_GP24swuGLcAI1S9LnCWwEmhPHQul2CGsDw/exec';
const ENVIO_CANALES = ['tiktok', 'ml', 'shein', 'amazon', 'walmart'];   // Temu ya no es canal de CeroCero
const CHANNEL_LABELS = { tiktok: 'TikTok', ml: 'ML', shein: 'SHEIN', amazon: 'Amazon', walmart: 'Walmart', temu: 'Temu' };
const MESES_ = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let semanaOffset = 0;    // 0 = semana actual, -1 = la anterior, etc.
let semanaData = null;

function lunesDeSemana_(offset) {
  const d = new Date();
  const dow = (d.getDay() + 6) % 7;   // 0=lunes … 6=domingo
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - dow + offset * 7);
  return d;
}
function fechaKey_(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function tituloSemana_(lunes) {
  const vie = new Date(lunes); vie.setDate(vie.getDate() + 4);
  return 'Semana ' + lunes.getDate() + '–' + vie.getDate() + ' ' + MESES_[vie.getMonth()];
}
async function cargarSemana_() {
  const lunes = lunesDeSemana_(semanaOffset);
  document.getElementById('sem-titulo').textContent = tituloSemana_(lunes);
  document.getElementById('sem-next').disabled = (semanaOffset >= 0);   // no navegar al futuro
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=envioSemana&inicio=' + fechaKey_(lunes), { redirect: 'follow' });
    semanaData = await res.json();
  } catch (err) { semanaData = null; }
  renderTablero_();
}
function renderTablero_() {
  const body = document.getElementById('tablero-body');
  if (!semanaData || !semanaData.dias) {
    body.innerHTML = '<p style="padding:16px;text-align:center;color:var(--muted);font-size:12px;">Sin datos</p>';
    return;
  }
  let html = '<table class="cal"><thead><tr><th class="dia" style="text-align:left;">Día</th>';
  ENVIO_CANALES.forEach(function (ch) { html += '<th>' + (CHANNEL_LABELS[ch] || ch) + '</th>'; });
  html += '<th class="tot">Total</th></tr></thead><tbody>';
  semanaData.dias.forEach(function (d) {
    const esHoy = (d.fecha === semanaData.hoy);
    const diaNum = Number(d.fecha.split('-')[2]);
    html += '<tr class="' + (esHoy ? 'hoy' : '') + '">';
    html += '<td class="dia">' + d.nombre.slice(0, 3) + ' ' + diaNum + (esHoy ? ' · hoy' : '') + '</td>';
    ENVIO_CANALES.forEach(function (ch) {
      const n = (d.canales && d.canales[ch]) || 0;
      html += '<td class="' + (n === 0 ? 'cero' : '') + '">' + n + '</td>';
    });
    html += '<td class="tot">' + (d.total || 0) + '</td></tr>';
  });
  html += '</tbody><tfoot><tr><td class="dia">Total</td>';
  ENVIO_CANALES.forEach(function (ch) { html += '<td>' + ((semanaData.totales && semanaData.totales[ch]) || 0) + '</td>'; });
  html += '<td>' + (semanaData.totalSemana || 0) + '</td></tr></tfoot></table>';
  body.innerHTML = html;
}
document.getElementById('sem-prev').addEventListener('click', function () { semanaOffset--; cargarSemana_(); });
document.getElementById('sem-next').addEventListener('click', function () { if (semanaOffset < 0) { semanaOffset++; cargarSemana_(); } });
cargarSemana_();
</script>
</body>
</html>
