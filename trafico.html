<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tráfico · CeroCero</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black:   #0D0D0D;
    --white:   #FFFFFF;
    --surface: #F5F5F5;
    --border:  #E8E8E8;
    --muted:   #999999;
    --green:   #1E9E4C;
    --amber:   #C97A00;
    --red:     #C0392B;
  }
  body {
    font-family: 'Montserrat', -apple-system, sans-serif;
    background: var(--white);
    color: var(--black);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .brand {
    font-size: 14px;
    font-weight: 200;
    color: var(--muted);
    letter-spacing: .25em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1 {
    font-size: clamp(34px, 8vw, 46px);
    font-weight: 900;
    letter-spacing: -.02em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
    margin-bottom: 14px;
  }
  .subtitle {
    font-size: 14px;
    font-weight: 200;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
    letter-spacing: .02em;
    margin-bottom: 36px;
  }
  /* ── Input donde "escribe" la pistola — se deja visible y con foco
       marcado, para que Tráfico vea siempre si está lista para el
       siguiente escaneo. ── */
  #scan-input {
    width: 100%;
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .05em;
    text-align: center;
    padding: 18px;
    border-radius: 2px;
    border: 1.5px solid var(--black);
    background: var(--white);
    color: var(--black);
    outline: none;
  }
  #scan-input::placeholder { color: var(--muted); font-weight: 200; }
  #scan-input:focus { background: var(--surface); }
  #scan-input:disabled { opacity: .4; }

  .result-card {
    margin-top: 28px;
    width: 100%;
    min-height: 180px;
    border-radius: 4px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .result-card.ok {
    background: var(--green);
    color: var(--white);
    border-color: var(--green);
  }
  .result-card.notfound {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
  }
  /* 🆕 (21-ago): aviso cuando el paquete YA se había marcado como
     Entregado antes de este escaneo — para detectar etiquetas repetidas
     por accidente. Color distinto (ámbar) para que no se confunda ni con
     el verde de éxito normal, ni con el negro de "no encontrado". */
  .result-card.repetido {
    background: var(--amber);
    color: var(--white);
    border-color: var(--amber);
  }
  /* 🆕 (24-ago): aviso cuando el pedido ya está marcado "Cancelado" en
     el Sheet de Ventas — segundo filtro además del aviso de Envío. Rojo,
     para distinguirlo claramente de los demás estados. */
  .result-card.cancelado {
    background: var(--red);
    color: var(--white);
    border-color: var(--red);
  }
  .result-card.error {
    background: var(--white);
    border: 1.5px dashed var(--black);
  }
  .state-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--white);
    font-weight: 900;
    margin-bottom: 14px;
  }
  .result-card.ok .state-icon,
  .result-card.notfound .state-icon,
  .result-card.repetido .state-icon,
  .result-card.cancelado .state-icon {
    background: var(--white);
    color: var(--black);
  }
  .result-card.ok .state-icon { color: var(--green); }
  .result-card.repetido .state-icon { color: var(--amber); }
  .result-card.cancelado .state-icon { color: var(--red); }
  .result-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -.01em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .result-code {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .05em;
    padding: 8px 16px;
    border-radius: 2px;
    background: rgba(0,0,0,.06);
    word-break: break-all;
  }
  .result-card.ok .result-code,
  .result-card.notfound .result-code,
  .result-card.repetido .result-code,
  .result-card.cancelado .result-code { background: rgba(255,255,255,.12); }
  .result-detail {
    font-size: 11px;
    font-weight: 200;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 10px;
  }
  .result-card.ok .result-detail,
  .result-card.notfound .result-detail,
  .result-card.repetido .result-detail,
  .result-card.cancelado .result-detail { color: rgba(255,255,255,.6); }
  .channel-badge {
    display: inline-flex;
    align-items: center;
    padding: 8px 20px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-top: 14px;
    border-radius: 2px;
    background: var(--white);
    color: var(--black);
  }
  .result-card.ok .channel-badge,
  .result-card.notfound .channel-badge,
  .result-card.repetido .channel-badge,
  .result-card.cancelado .channel-badge { background: rgba(255,255,255,.14); color: var(--white); }
  .placeholder {
    font-size: 12px;
    font-weight: 200;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* 🆕 (25-ago): contador de sesión + historial — para poder comparar
     "cuántos paquetes tengo en el bulto" contra "cuántos marcó el
     sistema" SIN tener que ir hasta la Sheet. Todo esto vive solo en
     memoria del navegador: se resetea cada vez que se recarga la
     página, a propósito, para que cada sesión de escaneo (cada bulto)
     empiece su cuenta en cero. */
  .session-bar {
    margin-top: 28px;
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    border-radius: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .session-count {
    font-size: 28px;
    font-weight: 900;
    line-height: 1;
  }
  .session-label {
    font-size: 11px;
    font-weight: 200;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  /* 🆕 (18-sep): totales guardados (leídos del backend, ?action=traficoCounts)
     — a diferencia del contador de sesión de arriba (que vive solo en memoria
     y se reinicia al recargar), estos NO se pierden: se guardan por día en el
     servidor. "Hoy" = lo entregado hoy; "Esta semana" = de lunes a hoy. */
  .totales-bar {
    margin-top: 12px;
    width: 100%;
    display: flex;
    gap: 12px;
  }
  .total-item {
    flex: 1;
    padding: 16px 12px;
    border-radius: 2px;
    background: var(--black);
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .total-num {
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
  }
  .total-label {
    font-size: 10px;
    font-weight: 200;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.6);
    text-align: center;
  }
  .historial {
    margin-top: 14px;
    width: 100%;
    max-height: 340px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 2px;
  }
  .historial-vacio {
    padding: 20px;
    text-align: center;
    font-size: 11px;
    font-weight: 200;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .historial-fila {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-left: 4px solid var(--muted);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .historial-fila:last-child { border-bottom: none; }
  .historial-fila.ok        { border-left-color: var(--green); }
  .historial-fila.repetido  { border-left-color: var(--amber); }
  .historial-fila.cancelado,
  .historial-fila.notfound,
  .historial-fila.error     { border-left-color: var(--red); }
  .historial-hora {
    font-weight: 200;
    color: var(--muted);
    flex-shrink: 0;
    width: 56px;
  }
  .historial-codigo {
    font-weight: 700;
    letter-spacing: .02em;
    flex: 1;
    word-break: break-all;
  }
  .historial-estado {
    font-weight: 900;
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    flex-shrink: 0;
    text-align: right;
  }
  .historial-fila.ok        .historial-estado { color: var(--green); }
  .historial-fila.repetido  .historial-estado { color: var(--amber); }
  .historial-fila.cancelado .historial-estado,
  .historial-fila.notfound  .historial-estado,
  .historial-fila.error     .historial-estado { color: var(--red); }
  .historial-repetido-sesion {
    display: block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--red);
    margin-top: 2px;
  }
</style>
</head>
<body>
<div id="app">
  <p class="brand">CeroCero</p>
  <h1>Tráfico</h1>
  <p class="subtitle">Conecta tu pistola/escáner a esta computadora<br>y escanea el código de cada paquete.</p>

  <input type="text" id="scan-input" autocomplete="off" autofocus placeholder="ESPERANDO ESCANEO...">

  <div class="result-card" id="result-card">
    <p class="placeholder">Aquí va apareciendo cada paquete escaneado</p>
  </div>

  <div class="session-bar">
    <span class="session-count" id="session-count">0</span>
    <span class="session-label">escaneados en esta sesión</span>
  </div>
  <div class="totales-bar">
    <div class="total-item">
      <span class="total-num" id="total-hoy">—</span>
      <span class="total-label">Entregados hoy</span>
    </div>
    <div class="total-item">
      <span class="total-num" id="total-semana">—</span>
      <span class="total-label">Esta semana</span>
    </div>
  </div>
  <div class="historial" id="historial">
    <p class="historial-vacio">Aquí se va a ir llenando la lista de esta sesión</p>
  </div>
</div>

<script>
// URL fija: la MISMA que usa el escáner principal (index.html) — este
// deployment ya sirve tanto envío como devolución como esta pantalla de
// tráfico, todo a través de action= en doGet. No se toca nada del flujo
// existente: esta pantalla solo llama a ?action=marcarEntregado, una
// acción nueva y aislada.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzyt2_OBXDiGStpeyTAkQGBAG_wWGI_GP24swuGLcAI1S9LnCWwEmhPHQul2CGsDw/exec';

const CHANNEL_LABELS = {
  temu:   'TEMU',
  shein:  'SHEIN',
  tiktok: 'TIKTOK',
  ml:     'ML',
  amazon: 'AMAZON',
  walmart: 'WALMART'   // (15-sep): FedEx, 34 digitos -> 12 (lo recorta el backend)
};

const input = document.getElementById('scan-input');
const card  = document.getElementById('result-card');

// 🆕 (25-ago): contador + historial de ESTA sesión (se resetea al
// recargar la página, a propósito — cada bulto empieza en cero).
// `vistosSesion` cuenta cuántas veces se ha escaneado cada código EN
// ESTA SESIÓN — esto es distinto del aviso "yaEntregado" que manda el
// backend (que revisa el Sheet completo, de cualquier día). Aquí lo que
// nos interesa es: "¿ya pasó esta misma etiqueta por AQUÍ, hace un
// rato, en este mismo bulto?" — útil para agarrar un doble-escaneo por
// accidente al momento, sin esperar a que alguien lo note después.
let contadorSesion = 0;
const vistosSesion = new Map(); // codigo -> veces visto en esta sesión
const sessionCountEl = document.getElementById('session-count');
const historialEl = document.getElementById('historial');
// 🔧 (25-ago v4): tope a la lista visible del historial — el CONTADOR de
// arriba sigue sumando el total real de la sesión sin límite, pero la
// lista de abajo (que sí vive como elementos en el navegador) solo
// conserva los últimos HISTORIAL_MAX_FILAS. Esto es para que una sesión
// larguísima (miles de escaneos sin recargar la página) nunca vaya
// haciendo más pesado el navegador — se recorta lo más viejo, que de
// todas formas ya no es lo que se necesita revisar al momento.
const HISTORIAL_MAX_FILAS = 300;

// 🆕 (18-sep): totales GUARDADOS (por día) — se leen del backend con
// ?action=traficoCounts. A diferencia del contador de sesión de arriba,
// estos NO se pierden al recargar/cerrar la página: viven en el servidor.
// Se cargan al abrir la pantalla, y suben en vivo con cada paquete nuevo
// marcado como Entregado (sin volver a preguntarle al servidor cada vez).
let totalHoy = null;
let totalSemana = null;
const hoyEl    = document.getElementById('total-hoy');
const semanaEl = document.getElementById('total-semana');

async function cargarTotales_() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=traficoCounts', { redirect: 'follow' });
    const data = await res.json();
    if (data && typeof data.hoy === 'number') {
      totalHoy = data.hoy;
      totalSemana = (typeof data.semana === 'number') ? data.semana : data.hoy;
      hoyEl.textContent = totalHoy;
      semanaEl.textContent = totalSemana;
    }
  } catch (err) {
    // Si falla la carga, los números se quedan en "—" y NO estorba el
    // escaneo — el conteo real igual queda guardado en el backend.
  }
}
// Sube +1 los totales en pantalla cuando se marca un paquete NUEVO como
// Entregado (mismo criterio que el backend: solo si NO estaba entregado
// antes). Si los totales aún no cargaron (null), no hace nada — al
// recargar se traen los reales del servidor.
function sumarTotalLocal_() {
  if (totalHoy !== null)    { totalHoy++;    hoyEl.textContent    = totalHoy; }
  if (totalSemana !== null) { totalSemana++; semanaEl.textContent = totalSemana; }
}
window.addEventListener('load', cargarTotales_);

function horaCorta() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' +
         String(d.getMinutes()).padStart(2, '0') + ':' +
         String(d.getSeconds()).padStart(2, '0');
}

// Agrega una fila al historial visible (arriba = más reciente) y sube
// el contador. `tipo` es una de: ok | repetido | cancelado | notfound |
// error — mismos nombres que usan las clases de result-card, para
// reusar los mismos colores.
function agregarHistorial(codigo, tipo, estadoTexto) {
  contadorSesion++;
  sessionCountEl.textContent = contadorSesion;

  const vecesAntes = vistosSesion.get(codigo) || 0;
  vistosSesion.set(codigo, vecesAntes + 1);

  if (historialEl.querySelector('.historial-vacio')) {
    historialEl.innerHTML = '';
  }

  const fila = document.createElement('div');
  fila.className = 'historial-fila ' + tipo;
  let extra = '';
  if (vecesAntes >= 1) {
    extra = '<span class="historial-repetido-sesion">🔁 ya se escaneó ' + (vecesAntes + 1) + ' veces en esta sesión</span>';
  }
  fila.innerHTML =
    '<span class="historial-hora">' + horaCorta() + '</span>' +
    '<span class="historial-codigo">' + codigo + extra + '</span>' +
    '<span class="historial-estado">' + estadoTexto + '</span>';
  historialEl.insertBefore(fila, historialEl.firstChild);

  // Recorta lo más viejo si ya se pasó del tope — se quita del final
  // (lo más antiguo, porque lo más reciente siempre se inserta al
  // principio).
  while (historialEl.children.length > HISTORIAL_MAX_FILAS) {
    historialEl.removeChild(historialEl.lastChild);
  }
}

// 🔧 (24-ago): ARREGLO DE LOS HUECOS EN PRODUCCIÓN — antes, mientras se
// procesaba un escaneo, el cuadro de texto se bloqueaba (input.disabled)
// para no cruzar dos escaneos. El problema: un campo de texto bloqueado
// en el navegador IGNORA por completo cualquier letra que le llegue — así
// que si la pistola escaneaba una etiqueta nueva mientras la anterior
// todavía se estaba procesando, esas letras se perdían sin ningún aviso.
// Eso eran los huecos que aparecieron en la columna "Entregado" al
// probar con Rodrigo: se escaneaban más rápido de lo que el sistema
// alcanzaba a procesar. Ahora el cuadro NUNCA se bloquea — siempre está
// listo para recibir el siguiente escaneo al instante — y cada escaneo
// que llega se guarda en una fila (cola).
//
// 🚀 (25-ago v4): antes la cola se procesaba de A UNO (un escaneo
// esperaba a que el anterior terminara del todo antes de empezar). Con
// mucho volumen eso significa que, aunque cada escaneo individual sea
// rápido, la fila se va acumulando detrás — si escaneas 10 paquetes en 3
// segundos, el último tarda 10 veces lo que tarda uno solo en quedar
// confirmado. Ahora se procesan varios AL MISMO TIEMPO (ver
// CONCURRENCIA_MAX abajo) — varios "trabajadores" sacan de la misma fila
// en paralelo, así que un lote grande se resuelve varias veces más
// rápido en total. Lo único que cambia para quien escanea: el resultado
// que se ve en pantalla puede no ser exactamente el último que
// escaneaste (puede terminar antes uno que escaneaste un poquito
// después) — pero el historial de abajo sigue registrando la hora real
// de cada uno, así que no se pierde ni se confunde ningún dato, solo el
// orden visual momentáneo puede variar. Ningún escaneo se pierde ni se
// pisa con otro — cada uno se procesa completo, de principio a fin, cada
// resultado se muestra y se agrega al historial exactamente una vez.
const CONCURRENCIA_MAX = 4;
const cola = [];
let trabajadoresActivos = 0;

async function trabajador_() {
  while (cola.length) {
    const codigo = cola.shift();
    await procesarUnEscaneo_(codigo);
  }
}

function focusInput() {
  input.focus();
}
window.addEventListener('load', focusInput);
document.addEventListener('click', focusInput);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) focusInput();
});

// Misma limpieza que ya usa el escáner principal — por si la pistola
// llega a leer alguna etiqueta con el prefijo "S..." de SHEIN.
function limpiarCodigo(raw) {
  const txt = String(raw || '').replace(/[\x00-\x1F\x7F]/g, '').trim();
  const m = txt.match(/^S([A-Za-z][A-Za-z0-9]{8})(?:_.*)?$/);
  return m ? m[1] : txt;
}

function mostrarCargando(codigo) {
  card.className = 'result-card';
  card.innerHTML =
    '<div class="state-icon">…</div>' +
    '<div class="result-title">Buscando</div>' +
    '<div class="result-code">' + codigo + '</div>';
}

// 🆕 (21-ago): si el backend dice que esta etiqueta YA estaba marcada
// como Entregado desde ANTES de este escaneo (data.yaEntregado), se
// muestra en ámbar en vez de verde, con un aviso claro de "ya se había
// escaneado" — para detectar a tiempo si se repitió por accidente el
// mismo paquete de envío. No bloquea nada: la fila se sigue marcando
// Entregado igual, solo se hace evidente que era un repetido.
// 🆕 (24-ago): si el pedido ya está marcado "Cancelado" en el Sheet de
// Ventas (data.cancelado), se muestra en rojo — segundo filtro además
// del aviso que ya existe en Envío, por si algo se canceló después de
// pasar por Envío o se les fue por alguna razón. Tampoco bloquea nada ni
// detiene la fila de escaneos: se marca "Entregado" igual (para que
// quede registro de que la paquetería sí se lo llevó), solo se hace
// evidente para revisarlo después. Si por algún motivo coinciden los
// dos avisos (cancelado Y repetido), gana Cancelado por ser lo más
// grave.
function mostrarOk(data) {
  const nombreCanal = CHANNEL_LABELS[data.channel] || data.channel || '—';
  // 🆕 (18-sep): si es un paquete NUEVO (no estaba entregado antes), sube
  // los totales "Hoy"/"Esta semana" en pantalla. Mismo criterio que el
  // backend (que ya sumó su contador con !yaEntregado). Los re-escaneos
  // (yaEntregado) NO suman. Va aquí arriba para que cuente igual aunque
  // el pedido esté Cancelado (el backend también lo cuenta como entregado).
  if (!data.yaEntregado) sumarTotalLocal_();
  if (data.cancelado) {
    card.className = 'result-card cancelado';
    card.innerHTML =
      '<div class="state-icon">✗</div>' +
      '<div class="result-title">Orden cancelada</div>' +
      '<div class="result-code">' + data.tracking + '</div>' +
      '<div class="result-detail">El Sheet de Ventas ya marca este pedido como Cancelado — revísalo</div>' +
      '<span class="channel-badge">' + nombreCanal + '</span>';
    agregarHistorial(data.tracking, 'cancelado', 'Cancelado');
    return;
  }
  if (data.yaEntregado) {
    card.className = 'result-card repetido';
    card.innerHTML =
      '<div class="state-icon">!</div>' +
      '<div class="result-title">Ya estaba entregado</div>' +
      '<div class="result-code">' + data.tracking + '</div>' +
      '<div class="result-detail">Esta etiqueta ya se había escaneado antes — revisa que no se repita el paquete</div>' +
      '<span class="channel-badge">' + nombreCanal + '</span>';
    agregarHistorial(data.tracking, 'repetido', 'Ya entregado');
    return;
  }
  card.className = 'result-card ok';
  card.innerHTML =
    '<div class="state-icon">✓</div>' +
    '<div class="result-title">Entregado</div>' +
    '<div class="result-code">' + data.tracking + '</div>' +
    '<div class="result-detail">' + data.filas + (data.filas === 1 ? ' fila marcada' : ' filas marcadas') + '</div>' +
    '<span class="channel-badge">' + nombreCanal + '</span>';
  agregarHistorial(data.tracking, 'ok', 'Entregado');
}

function mostrarNoEncontrado(data) {
  const nombreCanal = CHANNEL_LABELS[data.channel] || data.channel || '—';
  card.className = 'result-card notfound';
  card.innerHTML =
    '<div class="state-icon">✗</div>' +
    '<div class="result-title">No encontrado en Ventas</div>' +
    '<div class="result-code">' + data.tracking + '</div>' +
    '<span class="channel-badge">' + nombreCanal + '</span>';
  agregarHistorial(data.tracking, 'notfound', 'No encontrado');
}

function mostrarError(mensaje, codigo) {
  card.className = 'result-card error';
  card.innerHTML =
    '<div class="state-icon">!</div>' +
    '<div class="result-title">Error</div>' +
    (codigo ? '<div class="result-code">' + codigo + '</div>' : '') +
    '<div class="result-detail">' + mensaje + '</div>';
  agregarHistorial(codigo || '—', 'error', 'Error');
}

// Procesa UN escaneo contra el backend y pinta el resultado. Ya no
// controla el cuadro de texto para nada (ni lo bloquea ni lo limpia) —
// eso lo maneja el listener de abajo, al momento mismo del Enter, para
// que nunca se pierda una letra de la pistola mientras esto corre.
async function procesarUnEscaneo_(codigo) {
  mostrarCargando(codigo);
  try {
    const url = APPS_SCRIPT_URL + '?action=marcarEntregado&tracking=' + encodeURIComponent(codigo);
    const res = await fetch(url, { redirect: 'follow' });
    const data = await res.json();
    if (data.error) {
      mostrarError(data.error, codigo);
    } else if (!data.found) {
      mostrarNoEncontrado(data);
    } else {
      mostrarOk(data);
    }
  } catch (err) {
    mostrarError('Error de conexión: ' + err.message, codigo);
  }
}

// 🚀 (25-ago v4): prende "trabajadores" hasta llegar a CONCURRENCIA_MAX
// (o hasta que ya no quede nada en la fila) — cada uno saca códigos de
// la MISMA fila y los procesa de principio a fin, así que nunca hay dos
// trabajadores procesando el mismo código a la vez (cada `shift()` saca
// un código distinto). Si ya hay trabajadores suficientes corriendo,
// esta función no hace nada más — los que ya están activos van a
// terminar de sacar lo que se vaya agregando solos.
function procesarCola_() {
  while (trabajadoresActivos < CONCURRENCIA_MAX && cola.length) {
    trabajadoresActivos++;
    trabajador_().finally(function () { trabajadoresActivos--; });
  }
}

input.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const codigo = limpiarCodigo(input.value.trim());
  // El cuadro se limpia DE INMEDIATO (no se espera a nada) para que la
  // pistola pueda seguir escaneando ya mismo, sin importar si el
  // escaneo anterior sigue en proceso.
  input.value = '';
  if (codigo) {
    cola.push(codigo);
    procesarCola_();
  }
});
</script>
